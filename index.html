<!DOCTYPE html><html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Secret SMS Worldwide</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:system-ui;height:100vh;display:flex;flex-direction:column}#login{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;background:radial-gradient(circle at 30% 20%,#111 0%,#000 80%)}h1{color:#00ff88;font-size:32px;margin-bottom:5px;letter-spacing:2px}p{color:#888;margin-bottom:30px}input{width:100%;max-width:340px;padding:16px 18px;margin:8px 0;border-radius:12px;border:1px solid #222;background:#111;color:#fff;font-size:16px;outline:none}input:focus{border-color:#00ff88}button{width:100%;max-width:340px;padding:16px;margin-top:15px;border-radius:12px;border:none;background:#00ff88;color:#000;font-weight:900;font-size:17px;cursor:pointer}#chat{display:none;flex:1;flex-direction:column}.top{padding:12px 15px;background:#0a0a0a;border-bottom:1px solid #1a1a1a;display:flex;justify-content:space-between;align-items:center;font-size:14px}#msgs{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px}.msg{background:#151515;padding:12px 14px;border-radius:14px;max-width:80%;align-self:flex-start;border:1px solid #222}.msg.me{background:#00ff88;color:#000;align-self:flex-end;font-weight:600}.bottom{padding:12px;background:#0a0a0a;display:flex;gap:8px;border-top:1px solid #1a1a1a}.bottom input{flex:1;margin:0}.bottom button{width:70px;margin:0;border-radius:12px}</style></head><body><div id="login"><h1>SHINELYNE</h1><p>Secret SMS • Worldwide Live</p><input id="room" placeholder="Room ID (mf: shinelyne12)" value="shinelyne12"><input id="name" placeholder="Jina lako"><button onclick="join()">INGIA CHAT LIVE</button><div style="margin-top:20px;font-size:12px;color:#444">Vercel Ready • Node 24.x</div></div><div id="chat"><div class="top"><span id="rname"></span><span id="status" style="color:#00ff88">● Live</span></div><div id="msgs"></div><div class="bottom"><input id="msg" placeholder="Andika ujumbe..." onkeypress="if(event.key==='Enter')send()"><button onclick="send()">Tuma</button></div></div><script>let room,name,last=0;function join(){room=document.getElementById('room').value.trim()||'general';name=document.getElementById('name').value.trim()||'Mtu';if(!room)return;document.getElementById('login').style.display='none';document.getElementById('chat').style.display='flex';document.getElementById('rname').innerText='# '+room;load();setInterval(load,1500);}async function load(){try{let r=await fetch('/api/messages?room='+encodeURIComponent(room));let d=await r.json();if(d.length===last)return;last=d.length;let c=document.getElementById('msgs');c.innerHTML='';d.forEach(m=>{let div=document.createElement('div');div.className='msg'+(m.sender===name?' me':'');div.innerHTML='<b style="font-size:11px;opacity:.6">'+m.sender+'</b><br>'+m.message; c.appendChild(div);});c.scrollTop=c.scrollHeight;}catch(e){}}async function send(){let i=document.getElementById('msg');let t=i.value.trim();if(!t)return;i.value='';try{await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({room,sender:name,message:t})});load();}catch(e){}}</script></body></html>
