<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SHINELYNE - Secret SMS Worldwide</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
#login{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;background:radial-gradient(circle at 20% 10%,#111 0%,#000 70%)}
.logo{width:70px;height:70px;background:linear-gradient(135deg,#00ff88,#00cc66);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:15px}
h1{color:#00ff88;font-size:34px;letter-spacing:3px;font-weight:900;margin-bottom:4px}
.sub{color:#666;font-size:13px;letter-spacing:2px;margin-bottom:32px}
.input-group{width:100%;max-width:360px;margin:8px 0;position:relative}
.input-group label{font-size:11px;color:#666;letter-spacing:1px;margin-bottom:6px;display:block;margin-left:4px}
input{width:100%;padding:17px 18px;border-radius:14px;border:1.5px solid #222;background:#0f0f0f;color:#fff;font-size:15px;outline:none;transition:.2s}
input:focus{border-color:#00ff88;background:#111}
input.secret{border-color:#333;background:#0a0a0a}
input.secret:focus{border-color:#ffaa00}
button.main{width:100%;max-width:360px;padding:18px;margin-top:20px;border-radius:14px;border:none;background:linear-gradient(135deg,#00ff88,#00cc66);color:#000;font-weight:900;font-size:16px;letter-spacing:1px;cursor:pointer;box-shadow:0 4px 20px rgba(0,255,136,.3)}
button.main:active{transform:scale(.97)}
.hint{margin-top:18px;font-size:11px;color:#333;text-align:center;max-width:340px;line-height:1.5}
.hint span{color:#555}
#chat{display:none;flex:1;flex-direction:column;overflow:hidden}
.top{padding:14px 16px;background:#0a0a0a;border-bottom:1px solid #1c1c1c;display:flex;justify-content:space-between;align-items:center}
.top b{color:#00ff88;font-size:14px}
.top .right{display:flex;gap:12px;align-items:center}
#status{font-size:11px;color:#00ff88}
#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:#000}
.msg{padding:12px 14px;border-radius:18px;max-width:78%;font-size:14px;line-height:1.4;animation:pop .2s ease}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.msg .from{font-size:10px;opacity:.5;margin-bottom:4px;font-weight:700;letter-spacing:.5px}
.msg.other{background:#141414;border:1px solid #222;align-self:flex-start;border-bottom-left-radius:4px;color:#e5e5e5}
.msg.me{background:linear-gradient(135deg,#00ff88,#00dd77);color:#000;align-self:flex-end;border-bottom-right-radius:4px;font-weight:600}
.bottom{padding:12px 12px;background:#0a0a0a;border-top:1px solid #1c1c1c;display:flex;gap:10px;align-items:center;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.bottom input{flex:1;background:#151515;border-color:#222;margin:0}
.bottom button{width:60px;height:50px;border-radius:14px;border:none;background:#00ff88;color:#000;font-weight:900;font-size:14px;cursor:pointer}
.empty{text-align:center;padding:40px 20px;color:#333}
.empty div{font-size:40px;margin-bottom:10px}
</style>
</head>
<body>
<div id="login">
<div class="logo">💬</div>
<h1>SHINELYNE</h1>
<div class="sub">SECRET SMS • WORLDWIDE</div>

<div class="input-group">
<label>ROOM ID</label>
<input id="room" placeholder="mf: shinelyne12" value="shinelyne12">
</div>

<div class="input-group">
<label style="color:#ffaa00">🔑 SECRET KEY (SIRI - Watu wa key moja tu wanaona SMS)</label>
<input id="secret" class="secret" placeholder="Weka Secret Key (mf: 1234)" value="">
</div>

<div class="input-group">
<label>JINA LAKO</label>
<input id="name" placeholder="Jina lako">
</div>

<button class="main" onclick="join()">INGIA CHAT LIVE 🔓</button>

<div class="hint">
<span>Room + Secret Key = Chat ya siri</span><br>
Watu wawili wakiweka Room na Secret Key sawa - wanaona SMS zao tu.<br>
Watu wa Secret Key tofauti HAWATAONA.
</div>
</div>

<div id="chat">
<div class="top">
<div><b id="rname"># shinelyne12</b><div style="font-size:10px;color:#555" id="sname">Key: ••••</div></div>
<div class="right"><span id="status">● Live</span><span style="font-size:20px;cursor:pointer" onclick="location.reload()">✕</span></div>
</div>
<div id="msgs">
<div class="empty"><div>🔒</div>Chat ya siri iko tayari<br><span style="font-size:12px">SMS zitaonekana hapa</span></div>
</div>
<div class="bottom">
<input id="msg" placeholder="Andika ujumbe..." onkeypress="if(event.key==='Enter')send()">
<button onclick="send()">TUMA</button>
</div>
</div>

<script>
let room, name, secret, lastCount=0, intervalId;
function join(){
  room=document.getElementById('room').value.trim()||'general';
  name=document.getElementById('name').value.trim()||'Mtu';
  secret=document.getElementById('secret').value.trim()||'';
  if(!room){alert('Weka Room ID');return}
  if(!secret){if(!confirm('Huna Secret Key - Chat itaonekana na kila mtu. Endelea?'))return}
  document.getElementById('login').style.display='none';
  document.getElementById('chat').style.display='flex';
  document.getElementById('rname').innerText='# '+room;
  document.getElementById('sname').innerText='Key: '+(secret ? secret.replace(/./g,'•') : 'public');
  load();
  intervalId=setInterval(load,1200);
}
async function load(){
  try{
    let url='/api/messages?room='+encodeURIComponent(room)+'&secret='+encodeURIComponent(secret)+'&_='+Date.now();
    let r=await fetch(url);
    let d=await r.json();
    if(!Array.isArray(d)) return;
    if(d.length===lastCount && lastCount!==0) return;
    lastCount=d.length;
    let c=document.getElementById('msgs');
    if(d.length===0){
      c.innerHTML='<div class="empty"><div>💬</div>Hakuna SMS bado<br><span style="font-size:12px">Anza kutuma!</span></div>';
      return;
    }
    c.innerHTML='';
    d.forEach(m=>{
      let div=document.createElement('div');
      div.className='msg '+(m.sender===name?'me':'other');
      let safeMsg = (m.message||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      let safeSender = (m.sender||'Mtu').replace(/</g,'&lt;');
      div.innerHTML='<div class="from">'+safeSender+'</div>'+safeMsg;
      c.appendChild(div);
    });
    c.scrollTop=c.scrollHeight;
    document.getElementById('status').innerText='● Live • '+d.length;
  }catch(e){console.log('load error',e)}
}
async function send(){
  let i=document.getElementById('msg');
  let t=i.value.trim();
  if(!t) return;
  let tempMsg = t;
  i.value='';
  // optimistic UI
  let c=document.getElementById('msgs');
  if(lastCount===0) c.innerHTML='';
  let div=document.createElement('div');
  div.className='msg me';
  div.innerHTML='<div class="from">'+name+'</div>'+tempMsg.replace(/</g,'&lt;');
  c.appendChild(div);
  c.scrollTop=c.scrollHeight;
  try{
    let resp=await fetch('/api/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({room,sender:name,message:tempMsg,secret})
    });
    let res=await resp.json();
    if(res.ok) load();
  }catch(e){console.log(e); alert('Imeshindikana kutuma - jaribu tena')}
}
</script>
</body>
</html>
