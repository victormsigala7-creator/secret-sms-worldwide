<!DOCTYPE html>
<html lang="sw"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secret SMS - Worldwide</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:system-ui;display:flex;flex-direction:column;min-height:100vh}
.header{padding:20px;text-align:center;border-bottom:1px solid #222}
.header h1{color:#00ff88}
.room-box{max-width:400px;margin:40px auto;width:90%;background:#111;padding:30px;border-radius:20px;border:1px solid #222}
input{width:100%;padding:15px;margin:10px 0;background:#000;border:1px solid #333;border-radius:10px;color:#fff;font-size:16px}
button{width:100%;padding:15px;background:#00ff88;color:#000;border:none;border-radius:10px;font-weight:bold;font-size:16px;cursor:pointer;margin-top:10px}
#chat{flex:1;display:none;flex-direction:column;max-width:600px;width:100%;margin:0 auto;height:100vh}
#messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px}
.msg{background:#1a1a1a;padding:12px 16px;border-radius:18px;max-width:80%;word-break:break-word}
.msg.me{align-self:flex-end;background:#00ff88;color:#000}
.msg.other{align-self:flex-start}
.send-area{display:flex;gap:10px;padding:20px;background:#111;border-top:1px solid #222;position:sticky;bottom:0}
.send-area input{flex:1;margin:0}
.send-area button{width:80px;margin:0}
.status{color:#00ff88;text-align:center;padding:10px;font-size:14px}
.online{color:#888;font-size:12px;text-align:center;padding:5px}
</style>
</head><body>
<div class="header"><h1>🔐 Secret SMS</h1><p>Shinelyne - Worldwide 🌍 LIVE</p></div>

<div id="login" class="room-box">
<h3 style="margin-bottom:20px;text-align:center">Ingia Room</h3>
<input id="roomInput" placeholder="Room ID - mfano: shinelyne12" value="shinelyne12">
<input id="nameInput" placeholder="Jina lako">
<button onclick="joinRoom()">INGIA - LIVE CHAT</button>
<p style="margin-top:15px;font-size:12px;color:#888;text-align:center">Tumia Room moja na rafiki yako<br>Utaonana LIVE - Dunia Nzima!</p>
</div>

<div id="chat">
<div class="status" id="status">✅ LIVE - Room: <span id="roomLabel"></span></div>
<div class="online" id="online">Ina-update kila sekunde 2...</div>
<div id="messages"></div>
<div class="send-area">
<input id="msgInput" placeholder="Andika ujumbe..." onkeypress="if(event.key==='Enter')sendMsg()">
<button onclick="sendMsg()">Tuma</button>
</div>
</div>

<script>
let currentRoom, myName, lastCount=0, intervalId;
async function joinRoom(){
  currentRoom = document.getElementById('roomInput').value.trim().toLowerCase();
  myName = document.getElementById('nameInput').value.trim() || 'Mtu';
  if(!currentRoom){alert('Weka Room ID');return}
  document.getElementById('roomLabel').innerText=currentRoom;
  document.getElementById('login').style.display='none';
  document.getElementById('chat').style.display='flex';
  await loadMessages();
  intervalId = setInterval(loadMessages, 2000);
}
async function loadMessages(){
  try{
    const res = await fetch(`/api/messages?room=${encodeURIComponent(currentRoom)}`);
    const msgs = await res.json();
    if(msgs.length !== lastCount){
      const container = document.getElementById('messages');
      // only append new
      if(msgs.length > lastCount){
        for(let i=lastCount;i<msgs.length;i++){
          addMsg(msgs[i], false);
        }
      } else if(msgs.length < lastCount){
        container.innerHTML='';
        msgs.forEach(m=>addMsg(m,false));
      }
      lastCount = msgs.length;
      container.scrollTop = container.scrollHeight;
    }
  }catch(e){console.log(e)}
}
function addMsg(data, animate=true){
  const div=document.createElement('div');
  const isMe = data.sender===myName;
  div.className='msg '+(isMe?'me':'other');
  div.innerHTML=`<small style="opacity:.6">${data.sender}</small><br>${data.message}`;
  document.getElementById('messages').appendChild(div);
}
async function sendMsg(){
  const txt=document.getElementById('msgInput').value.trim();
  if(!txt) return;
  document.getElementById('msgInput').value='';
  await fetch(`/api/messages?room=${encodeURIComponent(currentRoom)}`, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({sender:myName, message:txt})
  });
  await loadMessages();
}
</script>
</body></html>
