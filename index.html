<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secret SMS - Shinelyne Worldwide</title>
<link rel="manifest" href="/manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:system-ui;min-height:100vh;display:flex;flex-direction:column}
.header{padding:20px;text-align:center;border-bottom:1px solid #222;background:#111}
.header h1{color:#00ff88;font-size:28px}
.header p{color:#888;font-size:13px;margin-top:5px}
.box{max-width:420px;margin:40px auto;width:90%;background:#111;padding:28px;border-radius:20px;border:1px solid #222}
input{width:100%;padding:14px;margin:8px 0;background:#000;border:1px solid #333;border-radius:12px;color:#fff;font-size:16px}
button{width:100%;padding:14px;background:#00ff88;color:#000;border:none;border-radius:12px;font-weight:bold;font-size:16px;cursor:pointer;margin-top:10px}
#chat{display:none;flex-direction:column;flex:1;max-width:600px;width:100%;margin:0 auto}
#messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px;min-height:300px}
.msg{padding:12px 16px;border-radius:18px;max-width:80%;word-break:break-word}
.msg.me{align-self:flex-end;background:#00ff88;color:#000}
.msg.other{align-self:flex-start;background:#1a1a1a;border:1px solid #2a2a2a}
.status{color:#00ff88;text-align:center;padding:12px;font-size:14px;background:#111;border-bottom:1px solid #222}
.send{display:flex;gap:10px;padding:16px;background:#111;border-top:1px solid #222}
.send input{flex:1;margin:0}
.send button{width:90px;margin:0}
.live{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
</style>
</head>
<body>
<div class="header"><h1>🔐 Secret SMS</h1><p>Shinelyne Enterprises - LIVE DUNIA NZIMA</p></div>

<div id="login" class="box">
<h3 style="text-align:center;margin-bottom:20px">Ingia Chat Room</h3>
<input id="room" placeholder="Room ID - mfano: shinelyne12" value="shinelyne12">
<input id="name" placeholder="Jina lako - mfano: Victor">
<button onclick="join()">INGIA - ANZA KUCHAT</button>
<p style="margin-top:18px;font-size:11px;color:#666;text-align:center">Watu wote wakitumia Room moja - mtachati LIVE!<br>Tumia room moja na rafiki yako</p>
</div>

<div id="chat">
<div class="status">✅ <span class="live">LIVE</span> - Room: <span id="rlabel"></span> | Online</div>
<div id="messages"></div>
<div class="send">
<input id="msg" placeholder="Andika ujumbe..." onkeydown="if(event.key==='Enter')send()">
<button onclick="send()">Tuma</button>
</div>
</div>

<script>
let ROOM='', NAME='', lastCount=0;
async function join(){
  ROOM=document.getElementById('room').value.trim().toLowerCase();
  NAME=document.getElementById('name').value.trim()||'Mtu';
  if(!ROOM){alert('Weka Room ID');return}
  document.getElementById('rlabel').innerText=ROOM;
  document.getElementById('login').style.display='none';
  document.getElementById('chat').style.display='flex';
  load();
  setInterval(load, 2000);
}
async function load(){
  try{
    const r=await fetch('/api/messages?room='+encodeURIComponent(ROOM));
    const msgs=await r.json();
    if(msgs.length===lastCount) return;
    lastCount=msgs.length;
    const box=document.getElementById('messages');
    box.innerHTML='';
    msgs.forEach(m=>{
      const d=document.createElement('div');
      d.className='msg '+(m.sender===NAME?'me':'other');
      d.innerHTML='<small style="opacity:.6;font-size:11px">'+m.sender+'</small><br>'+m.message;
      box.appendChild(d);
    });
    box.scrollTop=box.scrollHeight;
  }catch(e){}
}
async function send(){
  const inp=document.getElementById('msg');
  const txt=inp.value.trim();
  if(!txt) return;
  inp.value='';
  try{
    await fetch('/api/messages?room='+encodeURIComponent(ROOM),{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({room:ROOM,sender:NAME,message:txt})
    });
    load();
  }catch(e){alert('Shida ya mtandao');}
}
</script>
</body>
</html>
